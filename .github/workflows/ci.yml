name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: No unchecked Sendable
        run: ./scripts/check-no-unchecked.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
